<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Portal Admin — PASA 17</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('pasa17.theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* abaikan */ }
  })();
</script>
</head>
<body class="adm">
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">Portal admin membutuhkan JavaScript.</p></noscript>

<script src="js/config.js"></script>

<script src="js/admin-peserta.js"></script>
<script src="js/admin-scan.js"></script>
<script src="js/admin-konten.js"></script>
<script src="js/admin-app.js"></script>
</body>
</html>
